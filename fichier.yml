backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: always
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      #Si un jour nous déployons sur un vrai serveur, MINIO_PUBLIC_ENDPOINT devra être le nom de domaine/IP public de MinIO, pas localhost.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
    - ./data/chroma:/app/data/chroma
    - ./data/uploads:/app/data/uploads  # 🟢 À ajouter pour exposer les fichiers locaux

  # 4. Interface Frontend Streamlit
frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_frontend
    restart: always
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend